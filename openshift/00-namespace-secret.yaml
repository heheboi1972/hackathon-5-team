# 역할: Secret(WATSONX_API_KEY, POSTGRES_PASSWORD, ENCRYPTION_KEY, JWT_SECRET) + ConfigMap
# (참조: SCAFFOLD §2, .env.example)
#
# 네임스페이스(couple-report)는 이미 `oc new-project couple-report` 로 만들어져 있다.
# 이 파일은 여기 다시 만들지 않는다 — ROKS 는 self-service project 라 Namespace 오브젝트를
# 직접 apply 하는 것과 절차가 다르고, 이미 있는 프로젝트를 다시 선언할 필요가 없다.
#
# ⚠️ 이 파일은 절대 실제 비밀값을 채운 채로 커밋하지 않는다 (.env 를 커밋하지 않는 것과 같은 이유).
#    아래 stringData 는 전부 빈 값이다. 실제 값은 apply 후 이 명령으로 채운다 — git 이력에 안 남는다:
#
#      oc create secret generic couple-report-secrets -n couple-report \
#        --from-literal=WATSONX_API_KEY=<발급받은 키> \
#        --from-literal=WATSONX_PROJECT_ID=<UUID> \
#        --from-literal=POSTGRES_PASSWORD=<임의 생성> \
#        --from-literal=ENCRYPTION_KEY=$(python -c "from cryptography.fernet import Fernet;print(Fernet.generate_key().decode())") \
#        --from-literal=JWT_SECRET=$(openssl rand -hex 32) \
#        --dry-run=client -o yaml | oc apply -f -
#
#    (watsonx 키·프로젝트 ID 는 「watsonx 키 발급 런북」기준 — 팀 공용 키를 그대로 쓴다)
#
# postgres/qdrant StatefulSet(10·11번)은 이 Secret 의 POSTGRES_PASSWORD 만 참조한다.
# api Deployment(20번)는 전체를 env 로 주입한다.
apiVersion: v1
kind: Secret
metadata:
  name: couple-report-secrets
  namespace: couple-report
type: Opaque
stringData:
  WATSONX_API_KEY: ""
  WATSONX_PROJECT_ID: ""
  POSTGRES_PASSWORD: ""
  ENCRYPTION_KEY: ""
  JWT_SECRET: ""
---
# api Deployment(20번)에서 쓰는 비밀 아닌 설정값. .env.example 과 1:1 —
# watsonx URL·모델 ID처럼 팀 전체가 공유하고 굳이 숨길 필요 없는 값만 여기 둔다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: couple-report-config
  namespace: couple-report
data:
  AI_PROVIDER: "watsonx"
  APP_ENV: "openshift"
  LOG_LEVEL: "INFO"
  WATSONX_URL: "https://us-south.ml.cloud.ibm.com"
  WATSONX_MODEL_ID: "openai/gpt-oss-120b"
  WATSONX_EMBEDDING_MODEL_ID: "intfloat/multilingual-e5-large"
  WATSONX_REASONING_EFFORT: "low"
  WATSONX_MAX_TOKENS: "2000"
  QDRANT_URL: "http://qdrant:6333"
  QDRANT_COLLECTION_CONV: "couple_sessions"
  SESSION_GAP_MIN: "30"
  ALLOWED_ORIGINS: "REPLACE_AFTER_31_ROUTE"  # `oc get route couple-report-web -n couple-report` 결과로 교체 (31번 적용 후)
  KNOWLEDGE_DIR: "data/knowledge"
  INSTANA_SERVICE_NAME: "couple-report-api"
  # POSTGRES_DSN 은 여기 없다 — 비밀번호가 들어가는 값이라 ConfigMap 에 두지 않는다.
  # ConfigMap 값은 $(VAR) 치환이 안 되므로(컨테이너 env 목록에서만 동작), 20-api-deployment.yaml 이
  # POSTGRES_PASSWORD(Secret) 를 먼저 env 로 선언한 뒤 POSTGRES_DSN 값에서 $(POSTGRES_PASSWORD) 로 참조해 조립한다.
