# 역할: api Deployment + Service (참조: SCAFFOLD §2, api/Dockerfile)
#
# 이미지는 image-registry.openshift-image-registry.svc:5000/couple-report/couple-report-api:latest
# 를 가리킨다 — 3-11(Tekton) 이 buildah 로 여기 push 하는 걸 전제로 한다(클러스터 프리플라이트 문서,
# 실습 01_build_deploy_api_pipelinerun.yaml 과 동일 패턴). 3-11 이 아직 안 됐다면 이 파일을 적용해도
# 이미지가 없어 ImagePullBackOff 상태로 대기한다 — Deployment·Service·Secret 배선 자체는 미리 검증된다.
#
# imagePullPolicy: Always 필수 — 같은 태그(:latest)로 재빌드해도 롤아웃이 안 트리거되는 함정이
# 실습 자료 02_update_deployment_task.yaml 에 명시돼 있다 (클러스터 프리플라이트 참고).
#
# 적용 전 00·10·11 이 먼저 있어야 한다 (Secret·ConfigMap·postgres·qdrant).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: couple-report-api
  namespace: couple-report
  labels:
    app: couple-report-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: couple-report-api
  template:
    metadata:
      labels:
        app: couple-report-api
    spec:
      containers:
        - name: api
          image: image-registry.openshift-image-registry.svc:5000/couple-report/couple-report-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: couple-report-config
          env:
            # POSTGRES_DSN 은 비밀번호를 담으므로 ConfigMap 이 아니라 여기서 조립한다.
            # $(POSTGRES_PASSWORD) 치환은 "같은 컨테이너의 env 목록에서, 더 앞에 선언된 항목"만
            # 참조 가능하다 — 그래서 POSTGRES_PASSWORD 가 POSTGRES_DSN 보다 먼저 와야 한다.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: couple-report-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DSN
              value: "postgresql://couple:$(POSTGRES_PASSWORD)@postgres:5432/couple_report"
            - name: WATSONX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: couple-report-secrets
                  key: WATSONX_API_KEY
            - name: WATSONX_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: couple-report-secrets
                  key: WATSONX_PROJECT_ID
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: couple-report-secrets
                  key: ENCRYPTION_KEY
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: couple-report-secrets
                  key: JWT_SECRET
          readinessProbe:
            # /health/ready 는 postgres·qdrant 둘 다 붙어야 200 (routers/health.py). 붙기 전엔
            # 일부러 트래픽을 안 받는 게 맞는 동작 — Service 뒤에서 빠지는 것뿐, 파드가 죽는 건 아니다.
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: couple-report-api
  namespace: couple-report
  labels:
    app: couple-report-api
spec:
  selector:
    app: couple-report-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
