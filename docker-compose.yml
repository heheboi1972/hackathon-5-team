name: couple-report

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: couple_report
      POSTGRES_USER: couple
      POSTGRES_PASSWORD: couple
      TZ: Asia/Seoul
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U couple -d couple_report"]
      interval: 5s
      timeout: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.19.0
    ports: ["6333:6333"]
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    build:
      context: .                 # data/knowledge 를 이미지에 담기 위해 루트 (ISSUE A6)
      dockerfile: api/Dockerfile
    env_file: ./.env
    environment:
      POSTGRES_DSN: postgresql://couple:couple@postgres:5432/couple_report
      QDRANT_URL: http://qdrant:6333
      TZ: Asia/Seoul
    ports: ["8000:8000"]
    volumes:
      - ./data:/app/data:ro
    depends_on:
      postgres: { condition: service_healthy }
      qdrant: { condition: service_started }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health/ready',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  web:
    build: ./web
    ports: ["5173:8080"]
    depends_on: [api]

volumes:
  postgres_data:
  qdrant_data:
